name: Gift email (top players)

# Manual only. "test" sends one copy to DIGEST_TO; "live" sends to every row of
# the GIFT_RECIPIENTS secret and needs `confirm` = the recipient count.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = one copy to DIGEST_TO · live = all recipients'
        type: choice
        options: [test, live]
        default: test
      confirm:
        description: 'live only: type the number of recipients'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send
        env:
          MODE:           ${{ inputs.mode }}
          CONFIRM:        ${{ inputs.confirm }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM:           ${{ secrets.GIFT_FROM || secrets.DIGEST_FROM }}
          TEST_TO:        ${{ secrets.DIGEST_TO }},${{ secrets.GIFT_TEST_TO }}
          REPLY_TO:       ${{ secrets.DIGEST_TO }}
          RECIPIENTS:     ${{ secrets.GIFT_RECIPIENTS }}
        run: node tools/email-rating/send.js
