name: Weekly promotion digest

# Monday morning, Europe/Vienna. Two independent problems are solved here:
#
# 1. DST. GitHub cron is UTC-only with no DST awareness, so a single
#    expression drifts an hour twice a year.
#      06:00 UTC = 08:00 CEST (summer) | 07:00 UTC = 08:00 CET (winter)
#
# 2. DROPPED FIRINGS. GitHub's scheduler silently skips a large share of cron
#    events on busy repos — measured on yotamjacob/vanilla-sky-tracker as
#    roughly 10 runs/day landing out of 72 scheduled slots. A schedule with
#    one (or even two) slots per week will quietly miss weeks.
#
# Defence in depth, same shape as the vanilla-sky-tracker digest that has been
# running reliably:
#   * several Monday-morning slots — any ONE of them landing sends the digest
#   * a local-hour window so it always arrives at a sensible morning time
#   * a guard so only the FIRST success in a given week actually sends
on:
  schedule:
    - cron: '0 6 * * 1'    # 08:00 CEST / 07:00 CET
    - cron: '0 7 * * 1'    # 09:00 CEST / 08:00 CET
    - cron: '35 7 * * 1'   # backup
    - cron: '10 8 * * 1'   # backup
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'test'
        type: choice
        options: [test, smoke, dry-run, live]

env:
  TZ_NAME: Europe/Vienna
  HOUR_MIN: '8'    # earliest acceptable local hour
  HOUR_MAX: '10'   # latest acceptable local hour

permissions:
  contents: write   # commit the updated agents/seen.json
  actions: read     # the guard reads this workflow's own run history

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      send: ${{ steps.check.outputs.send }}
    steps:
      - name: Decide whether this firing should send
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual runs always proceed.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run — proceeding"; echo "send=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Only fire inside the local morning window, so backup slots don't
          # deliver at an odd hour.
          H=$(TZ="$TZ_NAME" date +%-H)
          echo "local hour in $TZ_NAME: $H (window ${HOUR_MIN}-${HOUR_MAX})"
          if [ "$H" -lt "$HOUR_MIN" ] || [ "$H" -gt "$HOUR_MAX" ]; then
            echo "outside window — skip"; echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Only the first success this week sends — the extra slots exist
          # purely as insurance against dropped firings.
          SINCE=$(date -u -d '6 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-6d +%Y-%m-%d)
          SENT=$(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-digest.yml \
                   --status success --created ">=$SINCE" --json databaseId --jq length)
          echo "successful digest runs since $SINCE: $SENT"
          if [ "$SENT" -eq 0 ]; then
            echo "send=true"  >> "$GITHUB_OUTPUT"
          else
            echo "already sent this week — skip"; echo "send=false" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.send == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=optional || npm install

      - name: Run digest
        env:
          # The repo secret is named ANTHROPIC (not ANTHROPIC_API_KEY); the SDK
          # reads ANTHROPIC_API_KEY from the environment, so map it here rather
          # than require the key to be re-entered under a second name.
          # `||` falls back if a correctly-named secret is added later.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM:       ${{ secrets.DIGEST_FROM }}
          DIGEST_TO:         ${{ secrets.DIGEST_TO }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            smoke)   node agents/digest.js --smoke ;;
            dry-run) node agents/digest.js --dry-run ;;
            test)    node agents/digest.js --test ;;
            *)       node agents/digest.js ;;
          esac

      # seen.json is the de-duplication state — worthless if it doesn't persist.
      - name: Persist de-duplication state
        run: |
          if git diff --quiet -- agents/seen.json; then
            echo "no state change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/seen.json
          git commit -m "chore(digest): record reported items [skip ci]"
          git push
